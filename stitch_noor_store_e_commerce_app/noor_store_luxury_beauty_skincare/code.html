<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noor Store — Luxury Beauty & Skincare</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM CDN + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FDF7F7',
              100: '#F9ECEE',
              200: '#F4D5D9',
              300: '#EAB2B9',
              400: '#DD8B97',
              500: '#C96574',
              600: '#B24B5B',
              rose: '#D48B96',
              rosegold: '#C5908E',
              gold: '#B68D40',
              cream: '#FAF7F2',
              surface: '#FFFDFC',
              dark: '#1E1718',
              muted: '#7C6F71'
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 8px 30px rgba(212, 139, 150, 0.08)',
            'card': '0 4px 20px rgba(178, 75, 91, 0.06)',
            'floating': '0 20px 40px -15px rgba(178, 75, 91, 0.15)',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #FAF7F2;
      color: #1E1718;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .gold-shimmer {
      background: linear-gradient(135deg, #D48B96 0%, #EAB2B9 50%, #C5908E 100%);
    }
    /* Toast animation */
    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-anim {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAF7F2] text-[#1E1718] selection:bg-rose-100 selection:text-rose-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Initial realistic beauty products
    const INITIAL_PRODUCTS = [
      {
        id: 1,
        title: "Luminous Silk Radiance Serum",
        price: 48.00,
        category: "Skincare",
        image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=800&q=80",
        description: "Enriched with pure botanical oils, hyaluronic acid, and 24K rose gold micronized flakes. Delivers a dewy, lit-from-within glow while restoring cellular elasticity and moisture barrier.",
        rating: 4.9,
        reviewsCount: 142,
        volume: "30ml / 1.0 fl.oz"
      },
      {
        id: 2,
        title: "Rose Petal Velvet Matte Lipstick",
        price: 32.00,
        category: "Lips",
        image: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=800&q=80",
        description: "A weightless velvet formula infused with camellia seed extract. Offers 12-hour comfortable hydration with rich pigment and a blurred rose petal finish that never creases.",
        rating: 4.8,
        reviewsCount: 98,
        volume: "3.8g"
      },
      {
        id: 3,
        title: "Desert Sunset Eyeshadow Palette",
        price: 56.00,
        category: "Eyes",
        image: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=800&q=80",
        description: "12 artisanal shades ranging from buttery warm terracotta mattes to dimensional rose-copper metallics and crystalline duo-chromes. Blendable, creamy, and long-wearing.",
        rating: 5.0,
        reviewsCount: 215,
        volume: "12 x 1.2g"
      },
      {
        id: 4,
        title: "Golden Hour Glow Facial Mist",
        price: 28.00,
        category: "Skincare",
        image: "https://images.unsplash.com/photo-1608248597359-5936798cfa10?auto=format&fit=crop&w=800&q=80",
        description: "An ultra-fine mist infused with Moroccan Damask rosewater, niacinamide, and elderberry flower extract. Refreshes makeup, calms redness, and creates an instant aura of freshness.",
        rating: 4.7,
        reviewsCount: 84,
        volume: "100ml / 3.4 fl.oz"
      },
      {
        id: 5,
        title: "Celestial Rose Hydrating Cream",
        price: 64.00,
        category: "Skincare",
        image: "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?auto=format&fit=crop&w=800&q=80",
        description: "A decadent whipped cloud cream that melts onto skin with peony peptide complexes, squalane, and organic shea butter. Locks in 72-hour deep moisture for supple, plump texture.",
        rating: 4.9,
        reviewsCount: 178,
        volume: "50ml / 1.7 oz"
      },
      {
        id: 6,
        title: "Sheer Nectar Peptide Lip Glaze",
        price: 24.00,
        category: "Lips",
        image: "https://images.unsplash.com/photo-1607602132700-068258431c6c?auto=format&fit=crop&w=800&q=80",
        description: "Non-sticky, mirror-shine treatment enriched with multi-peptides and jojoba butter. Visibly enhances lip contour, fills fine lines, and leaves a delicate shimmer of rose quartz.",
        rating: 4.8,
        reviewsCount: 120,
        volume: "12ml"
      }
    ];

    const WHATSAPP_PHONE = "201001234567"; // Specified format

    function App() {
      // Views: 'home', 'product-details', 'cart', 'login', 'admin'
      const [currentView, setCurrentView] = useState('home');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [cart, setCart] = useState([]);
      const [toast, setToast] = useState(null);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [activeCategory, setActiveCategory] = useState("All");

      // Trigger icons re-render on DOM changes
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Show temporary toast notification
      const showToast = (message) => {
        setToast(message);
        setTimeout(() => {
          setToast(null);
        }, 2800);
      };

      // Cart management
      const addToCart = (product, quantity = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item =>
              item.id === product.id
                ? { ...item, quantity: item.quantity + quantity }
                : item
            );
          } else {
            return [...prev, { ...product, quantity }];
          }
        });
        showToast(`Added "${product.title}" to your shopping bag`);
      };

      const updateQuantity = (productId, delta) => {
        setCart(prev => {
          return prev
            .map(item => {
              if (item.id === productId) {
                const newQty = item.quantity + delta;
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            })
            .filter(Boolean);
        });
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.id !== productId));
        showToast("Item removed from your bag");
      };

      const totalItemsCount = useMemo(() => {
        return cart.reduce((acc, item) => acc + item.quantity, 0);
      }, [cart]);

      const cartTotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      }, [cart]);

      // Navigation handler
      const navigateTo = (view, product = null) => {
        setCurrentView(view);
        if (product) {
          setSelectedProduct(product);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // WhatsApp links
      const handleOrderSingleViaWhatsApp = (prod) => {
        const text = `Hello Noor Store, I would like to order: ${prod.title} (Price: $${prod.price.toFixed(2)})`;
        const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      const handleCheckoutCartViaWhatsApp = () => {
        if (cart.length === 0) return;
        const itemsList = cart.map(i => `• ${i.title} x${i.quantity} ($${(i.price * i.quantity).toFixed(2)})`).join('\n');
        const text = `Hello Noor Store, I would like to order the following items from my cart:\n\n${itemsList}\n\n*Total Order Price:* $${cartTotal.toFixed(2)}\n\nPlease provide payment and delivery details. Thank you!`;
        const url = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      return (
        <div className="flex flex-col min-h-screen bg-[#FAF7F2]">
          {/* Top Announcement Bar */}
          <div className="bg-[#1E1718] text-[#F9ECEE] text-xs py-2 px-4 text-center tracking-widest uppercase font-medium flex items-center justify-center gap-3">
            <span>✨ Complimentary Rose Gold Silk Pouch with Orders Over $75</span>
            <span className="hidden md:inline">•</span>
            <span className="hidden md:inline">Express Worldwide Shipping & WhatsApp Concierge</span>
          </div>

          {/* Global Header / Navbar */}
          <header className="sticky top-0 z-40 bg-[#FFFDFC]/90 backdrop-blur-md border-b border-[#F4D5D9]/60 transition-all">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div 
                onClick={() => navigateTo('home')}
                className="cursor-pointer flex items-center gap-3 group"
              >
                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-[#D48B96] to-[#F4D5D9] flex items-center justify-center shadow-md group-hover:scale-105 transition-transform duration-300">
                  <span className="font-serif text-white font-bold text-lg tracking-wider">N</span>
                </div>
                <div>
                  <span className="font-serif text-2xl font-bold tracking-tight text-[#1E1718] block leading-tight">
                    NOOR <span className="font-light italic text-[#B24B5B]">Store</span>
                  </span>
                  <span className="text-[10px] tracking-[0.25em] text-[#7C6F71] uppercase block -mt-0.5">Haute Beauté</span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center space-x-8">
                <button
                  onClick={() => navigateTo('home')}
                  className={`text-sm font-medium tracking-wide transition-colors duration-200 ${
                    currentView === 'home' || currentView === 'product-details' 
                      ? 'text-[#B24B5B] border-b-2 border-[#B24B5B] pb-1' 
                      : 'text-[#7C6F71] hover:text-[#1E1718]'
                  }`}
                >
                  Home & Catalog
                </button>
                <button
                  onClick={() => {
                    if (isAuthenticated) {
                      navigateTo('admin');
                    } else {
                      navigateTo('login');
                    }
                  }}
                  className={`text-sm font-medium tracking-wide transition-colors duration-200 flex items-center gap-1.5 ${
                    currentView === 'admin'
                      ? 'text-[#B24B5B] border-b-2 border-[#B24B5B] pb-1'
                      : 'text-[#7C6F71] hover:text-[#1E1718]'
                  }`}
                >
                  <i data-lucide="shield-check" class="w-4 h-4 text-[#B24B5B]"></i>
                  Admin Dashboard
                </button>
                <button
                  onClick={() => navigateTo('login')}
                  className={`text-sm font-medium tracking-wide transition-colors duration-200 flex items-center gap-1.5 ${
                    currentView === 'login' 
                      ? 'text-[#B24B5B] border-b-2 border-[#B24B5B] pb-1' 
                      : 'text-[#7C6F71] hover:text-[#1E1718]'
                  }`}
                >
                  <i data-lucide="user" class="w-4 h-4"></i>
                  {isAuthenticated ? 'Account (Active)' : 'Login'}
                </button>
              </nav>

              {/* Cart Button & Mobile Nav */}
              <div className="flex items-center space-x-4">
                <button
                  onClick={() => navigateTo('cart')}
                  className="relative p-2.5 rounded-full bg-[#F9ECEE]/70 hover:bg-[#F4D5D9] transition-all duration-200 text-[#1E1718] flex items-center justify-center group"
                  aria-label="View shopping bag"
                >
                  <i data-lucide="shopping-bag" class="w-5 h-5 group-hover:scale-110 transition-transform text-[#B24B5B]"></i>
                  {totalItemsCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#B24B5B] text-white text-[11px] font-bold h-5 min-w-[20px] px-1 rounded-full flex items-center justify-center shadow-md animate-pulse">
                      {totalItemsCount}
                    </span>
                  )}
                </button>

                {/* Mobile view quick switcher */}
                <div className="md:hidden flex items-center">
                  <button 
                    onClick={() => navigateTo(currentView === 'home' ? 'cart' : 'home')}
                    className="text-xs px-3 py-1.5 rounded-lg border border-[#F4D5D9] text-[#7C6F71]"
                  >
                    {currentView === 'home' ? 'Cart' : 'Shop'}
                  </button>
                </div>
              </div>

            </div>
          </header>

          {/* Main Body View Switching */}
          <main className="flex-1">
            {currentView === 'home' && (
              <ProductsHomeView 
                products={products}
                onSelectProduct={(p) => navigateTo('product-details', p)}
                onAddToCart={addToCart}
                activeCategory={activeCategory}
                setActiveCategory={setActiveCategory}
              />
            )}

            {currentView === 'product-details' && selectedProduct && (
              <ProductDetailsView 
                product={selectedProduct}
                onBack={() => navigateTo('home')}
                onAddToCart={addToCart}
                onOrderWhatsApp={handleOrderSingleViaWhatsApp}
              />
            )}

            {currentView === 'cart' && (
              <CartView 
                cart={cart}
                total={cartTotal}
                onUpdateQty={updateQuantity}
                onRemoveItem={removeFromCart}
                onContinueShopping={() => navigateTo('home')}
                onCheckoutWhatsApp={handleCheckoutCartViaWhatsApp}
              />
            )}

            {currentView === 'login' && (
              <LoginView 
                isAuthenticated={isAuthenticated}
                onLoginSuccess={() => {
                  setIsAuthenticated(true);
                  showToast("Welcome back, Admin!");
                  navigateTo('admin');
                }}
                onLogout={() => {
                  setIsAuthenticated(false);
                  showToast("Signed out successfully");
                  navigateTo('home');
                }}
                onCancel={() => navigateTo('home')}
              />
            )}

            {currentView === 'admin' && (
              <AdminDashboardView 
                isAuthenticated={isAuthenticated}
                products={products}
                onAddProduct={(newProd) => {
                  setProducts(prev => [newProd, ...prev]);
                  showToast(`Product "${newProd.title}" successfully published to catalog!`);
                }}
                onDeleteProduct={(id) => {
                  setProducts(prev => prev.filter(p => p.id !== id));
                  showToast("Product deleted from catalog");
                }}
                onGoToLogin={() => navigateTo('login')}
                onViewStore={() => navigateTo('home')}
              />
            )}
          </main>

          {/* Toast Alert */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 toast-anim">
              <div className="bg-[#1E1718] text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center space-x-3 border border-[#F4D5D9]/20">
                <span className="w-2.5 h-2.5 rounded-full bg-[#DD8B97] animate-ping"></span>
                <span className="text-sm font-medium">{toast}</span>
                <i data-lucide="sparkles" class="w-4 h-4 text-[#DD8B97]"></i>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#FFFDFC] border-t border-[#F4D5D9] mt-20 pt-14 pb-8 text-center sm:text-left">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-10">
              <div className="md:col-span-1">
                <div className="flex items-center gap-2 mb-3 justify-center sm:justify-start">
                  <div className="w-7 h-7 rounded-full bg-[#D48B96] flex items-center justify-center text-white font-serif text-sm">N</div>
                  <span className="font-serif text-xl font-bold tracking-tight">NOOR <span className="font-light italic text-[#B24B5B]">Store</span></span>
                </div>
                <p className="text-xs text-[#7C6F71] leading-relaxed mb-4">
                  Curated luxury cosmetics, clean botanical skincare, and couture pigments created to accentuate your timeless grace.
                </p>
                <div className="flex gap-3 justify-center sm:justify-start">
                  <span className="w-8 h-8 rounded-full bg-[#F9ECEE] text-[#B24B5B] flex items-center justify-center cursor-pointer hover:bg-[#B24B5B] hover:text-white transition-colors">
                    <i data-lucide="instagram" class="w-4 h-4"></i>
                  </span>
                  <span className="w-8 h-8 rounded-full bg-[#F9ECEE] text-[#B24B5B] flex items-center justify-center cursor-pointer hover:bg-[#B24B5B] hover:text-white transition-colors">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                  </span>
                </div>
              </div>

              <div>
                <h4 className="font-serif text-sm font-semibold uppercase tracking-wider text-[#1E1718] mb-3">Boutique</h4>
                <ul className="space-y-2 text-xs text-[#7C6F71]">
                  <li><button onClick={() => navigateTo('home')} className="hover:text-[#B24B5B]">All Products</button></li>
                  <li><button onClick={() => navigateTo('home')} className="hover:text-[#B24B5B]">Skincare Elixirs</button></li>
                  <li><button onClick={() => navigateTo('home')} className="hover:text-[#B24B5B]">Velvet Lip Pigments</button></li>
                  <li><button onClick={() => navigateTo('home')} className="hover:text-[#B24B5B]">Face & Complexion</button></li>
                </ul>
              </div>

              <div>
                <h4 className="font-serif text-sm font-semibold uppercase tracking-wider text-[#1E1718] mb-3">Concierge & Orders</h4>
                <p className="text-xs text-[#7C6F71] leading-relaxed mb-3">
                  Direct WhatsApp beauty advisors ready to assist with shade matching and bespoke orders.
                </p>
                <a 
                  href={`https://wa.me/${WHATSAPP_PHONE}?text=Hello%20Noor%20Store,%20I%20have%20an%20inquiry`} 
                  target="_blank" 
                  rel="noreferrer"
                  className="inline-flex items-center gap-2 text-xs font-semibold text-[#B24B5B] hover:underline"
                >
                  <i data-lucide="phone-call" class="w-3.5 h-3.5"></i>
                  Chat with Concierge
                </a>
              </div>

              <div>
                <h4 className="font-serif text-sm font-semibold uppercase tracking-wider text-[#1E1718] mb-3">Portal Access</h4>
                <p className="text-xs text-[#7C6F71] mb-3">Manage inventory, add collections, and update price catalogs.</p>
                <button
                  onClick={() => navigateTo('login')}
                  className="px-3.5 py-1.5 rounded-lg border border-[#DD8B97] text-xs text-[#B24B5B] hover:bg-[#F9ECEE] transition"
                >
                  Admin Terminal
                </button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 pt-6 border-t border-[#F4D5D9]/50 flex flex-col sm:flex-row items-center justify-between text-xs text-[#7C6F71]">
              <p>© {new Date().getFullYear()} Noor Store Haute Beauté. All rights reserved.</p>
              <p className="mt-2 sm:mt-0 flex items-center gap-1">
                <span>Designed with soft rose tones & pure luxury</span>
              </p>
            </div>
          </footer>

        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 1: PRODUCTS HOME (CATALOG)
    // -------------------------------------------------------------
    function ProductsHomeView({ products, onSelectProduct, onAddToCart, activeCategory, setActiveCategory }) {
      const categories = ["All", "Skincare", "Lips", "Eyes"];

      const filteredProducts = activeCategory === "All" 
        ? products 
        : products.filter(p => p.category === activeCategory);

      return (
        <div>
          {/* Hero Banner */}
          <section className="relative overflow-hidden bg-gradient-to-b from-[#F9ECEE] via-[#FAF7F2] to-[#FAF7F2] py-14 lg:py-20 border-b border-[#F4D5D9]/50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <div className="lg:col-span-7 text-center lg:text-left">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#FFFDFC] border border-[#F4D5D9] shadow-sm mb-4">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-[#B24B5B]"></i>
                    <span className="text-xs tracking-wider uppercase font-semibold text-[#B24B5B]">New Spring Haute Collection</span>
                  </div>
                  <h1 className="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-[#1E1718] leading-[1.15] mb-6">
                    Illuminate your aura with <span className="italic font-normal text-[#B24B5B]">timeless grace.</span>
                  </h1>
                  <p className="text-base sm:text-lg text-[#7C6F71] max-w-xl mx-auto lg:mx-0 font-light leading-relaxed mb-8">
                    Discover Noor Store’s botanical infusions and velvety formulas designed to nourish, sculpt, and elevate your daily beauty ritual.
                  </p>
                  <div className="flex flex-wrap items-center justify-center lg:justify-start gap-4">
                    <a
                      href="#collection-grid"
                      className="px-7 py-3.5 rounded-full bg-[#1E1718] hover:bg-[#B24B5B] text-white text-sm font-medium tracking-wide shadow-lg transition-all duration-300 transform hover:-translate-y-0.5"
                    >
                      Explore The Collection
                    </a>
                    <a
                      href={`https://wa.me/${WHATSAPP_PHONE}?text=Hello%20Noor%20Store,%20I%20would%20like%20a%20personal%20beauty%20consultation`}
                      target="_blank"
                      rel="noreferrer"
                      className="px-6 py-3.5 rounded-full bg-[#FFFDFC] border border-[#F4D5D9] hover:border-[#B24B5B] text-[#B24B5B] text-sm font-medium shadow-sm transition flex items-center gap-2"
                    >
                      <i data-lucide="message-circle" class="w-4 h-4 text-emerald-600"></i>
                      WhatsApp Beauty Advisor
                    </a>
                  </div>
                </div>

                {/* Hero Feature Visual */}
                <div className="lg:col-span-5 relative">
                  <div className="relative mx-auto max-w-sm rounded-3xl overflow-hidden shadow-2xl border-4 border-white">
                    <img 
                      src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80" 
                      alt="Noor Store Beauty Atmosphere"
                      className="w-full h-80 sm:h-96 object-cover transform hover:scale-105 transition-transform duration-700"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex flex-col justify-end p-6 text-white">

    // -------------------------------------------------------------
    function LoginView({ isAuthenticated, onLoginSuccess, onLogout, onCancel }) {
      const [email, setEmail] = useState("admin@noorstore.com");
      const [password, setPassword] = useState("admin123");
      const [error, setError] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        // Simple demo authentication check
        if (email.trim() && password.trim()) {
          onLoginSuccess();
        } else {
          setError("Please enter valid credentials.");
        }
      };

      if (isAuthenticated) {
        return (
          <div className="max-w-md mx-auto px-4 py-16 text-center">
            <div className="bg-[#FFFDFC] rounded-3xl border border-[#F4D5D9] p-8 shadow-card">
              <div className="w-14 h-14 rounded-full bg-[#F9ECEE] text-[#B24B5B] flex items-center justify-center mx-auto mb-4">
                <i data-lucide="shield-check" class="w-7 h-7"></i>
              </div>
              <h2 className="font-serif text-2xl font-bold text-[#1E1718] mb-2">Admin Session Active</h2>
              <p className="text-xs text-[#7C6F71] mb-6">You are authenticated with full store management permissions.</p>
              <div className="space-y-3">
                <button
                  onClick={onCancel}
                  className="w-full py-3 rounded-xl bg-[#B24B5B] text-white text-xs uppercase font-bold tracking-wider hover:bg-[#9E3E4D] transition"
                >
                  Return to Dashboard
                </button>
                <button
                  onClick={onLogout}
                  className="w-full py-3 rounded-xl border border-[#F4D5D9] text-[#7C6F71] hover:text-rose-600 text-xs font-semibold transition"
                >
                  Log Out
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto px-4 py-16">
          <div className="bg-[#FFFDFC] rounded-3xl border border-[#F4D5D9] p-8 sm:p-10 shadow-soft">
            
            <div className="text-center mb-8">
              <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-[#D48B96] to-[#F4D5D9] text-white flex items-center justify-center mx-auto mb-3 shadow-md">
                <span className="font-serif font-bold text-xl">N</span>
              </div>
              <h1 className="font-serif text-2xl font-bold text-[#1E1718]">Admin Authentication</h1>
              <p className="text-xs text-[#7C6F71] mt-1">Sign in to manage catalog items, pricing, and store settings</p>
            </div>

            {error && (
              <div className="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                  Staff Email
                </label>
                <input 
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="admin@noorstore.com"
                  className="w-full px-4 py-3 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white transition"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                  Password
                </label>
                <input 
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full px-4 py-3 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white transition"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-[#1E1718] hover:bg-[#B24B5B] text-white text-xs uppercase font-bold tracking-widest transition shadow-md"
                >
                  Access Admin Terminal
                </button>
              </div>

              <div className="text-center pt-2">
                <span className="text-[11px] text-[#7C6F71]">
                  Demo Credentials pre-filled for instant testing.
                </span>
              </div>
            </form>

          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 5: ADMIN DASHBOARD
    // -------------------------------------------------------------
    function AdminDashboardView({ isAuthenticated, products, onAddProduct, onDeleteProduct, onGoToLogin, onViewStore }) {
      const [title, setTitle] = useState("");
      const [price, setPrice] = useState("");
      const [category, setCategory] = useState("Skincare");
      const [imageUrl, setImageUrl] = useState("");
      const [description, setDescription] = useState("");

      // Guard check
      if (!isAuthenticated) {
        return (
          <div className="max-w-md mx-auto px-4 py-16 text-center">
            <div className="bg-[#FFFDFC] rounded-3xl border border-[#F4D5D9] p-8 shadow-card">
              <i data-lucide="lock" class="w-12 h-12 text-[#DD8B97] mx-auto mb-3"></i>
              <h2 className="font-serif text-2xl font-bold text-[#1E1718] mb-2">Restricted Admin Area</h2>
              <p className="text-xs text-[#7C6F71] mb-6">Please log in with admin credentials to access product management tools.</p>
              <button
                onClick={onGoToLogin}
                className="w-full py-3.5 rounded-xl bg-[#B24B5B] text-white text-xs uppercase font-bold tracking-wider hover:bg-[#9E3E4D] transition"
              >
                Go to Login
              </button>
            </div>
          </div>
        );
      }

      const handleAddSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !price || !description.trim()) {
          alert("Please fill in the product title, price, and description.");
          return;
        }

        const fallbackImg = "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80";

        const newProduct = {
          id: Date.now(),
          title: title.trim(),
          price: parseFloat(price) || 25.00,
          category: category,
          image: imageUrl.trim() || fallbackImg,
          description: description.trim(),
          rating: 5.0,
          reviewsCount: 1,
          volume: "Custom Volume"
        };

        onAddProduct(newProduct);

        // Reset form
        setTitle("");
        setPrice("");
        setImageUrl("");
        setDescription("");
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          
          {/* Top Admin Header */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-[#F4D5D9]">
            <div>
              <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-semibold mb-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Admin Session Verified
              </div>
              <h1 className="font-serif text-3xl font-bold text-[#1E1718]">Store Catalog Management</h1>
              <p className="text-xs text-[#7C6F71]">Add new luxury items, modify real-time inventory, and audit catalog listings.</p>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={onViewStore}
                className="px-4 py-2.5 rounded-xl border border-[#F4D5D9] bg-white text-xs font-semibold text-[#1E1718] hover:bg-[#F9ECEE] transition flex items-center gap-1.5"
              >
                <i data-lucide="eye" class="w-4 h-4 text-[#B24B5B]"></i>
                View Live Store
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            {/* Form to Add New Product */}
            <div className="lg:col-span-5 bg-[#FFFDFC] rounded-3xl border border-[#F4D5D9] p-6 sm:p-8 shadow-card">
              <div className="flex items-center gap-2 mb-6">
                <div className="w-8 h-8 rounded-lg bg-[#F9ECEE] text-[#B24B5B] flex items-center justify-center">
                  <i data-lucide="plus-circle" class="w-5 h-5"></i>
                </div>
                <h2 className="font-serif text-xl font-bold text-[#1E1718]">Publish New Beauty Product</h2>
              </div>

              <form onSubmit={handleAddSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                    Product Title *
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Damascus Rose Overnight Infusion"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-xs sm:text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                      Price ($ USD) *
                    </label>
                    <input
                      type="number"
                      step="0.01"
                      required
                      placeholder="45.00"
                      value={price}
                      onChange={(e) => setPrice(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-xs sm:text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                      Category
                    </label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-xs sm:text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white"
                    >
                      <option value="Skincare">Skincare</option>
                      <option value="Lips">Lips</option>
                      <option value="Eyes">Eyes</option>
                      <option value="Complexion">Complexion</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                    Product Image URL
                  </label>
                  <input
                    type="url"
                    placeholder="https://images.unsplash.com/..."
                    value={imageUrl}
                    onChange={(e) => setImageUrl(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-xs sm:text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white"
                  />
                  <span className="text-[10px] text-[#7C6F71] mt-1 block">Leave empty to use high-res luxury placeholder</span>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-[#7C6F71] mb-1.5">
                    Description & Formula Notes *
                  </label>
                  <textarea
                    rows="3"
                    required
                    placeholder="Describe botanical ingredients, skin benefits, finish..."
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-[#F4D5D9] bg-[#FAF7F2] text-xs sm:text-sm focus:outline-none focus:border-[#B24B5B] focus:bg-white resize-none"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-[#B24B5B] hover:bg-[#9E3E4D] text-white text-xs font-bold tracking-wider uppercase transition shadow-md flex items-center justify-center gap-2"
                >
                  <i data-lucide="sparkles" class="w-4 h-4"></i>
                  Add to Store Catalog
                </button>
              </form>
            </div>

            {/* Current Products Inventory Table */}
            <div className="lg:col-span-7 bg-[#FFFDFC] rounded-3xl border border-[#F4D5D9] p-6 sm:p-8 shadow-card">
              <div className="flex items-center justify-between mb-4">
                <h2 className="font-serif text-xl font-bold text-[#1E1718]">
                  Current Inventory ({products.length})
                </h2>
                <span className="text-xs text-[#7C6F71]">Dynamic session state</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-[#F4D5D9] text-[#7C6F71] uppercase tracking-wider font-semibold">
                      <th className="pb-3">Product</th>
                      <th className="pb-3">Category</th>
                      <th className="pb-3">Price</th>
                      <th className="pb-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#F4D5D9]/50">
                    {products.map(item => (
                      <tr key={item.id} className="hover:bg-[#FAF7F2]/50 transition">
                        <td className="py-3 pr-2 flex items-center gap-2.5">
                          <img 
                            src={item.image} 
                            alt={item.title}
                            className="w-10 h-10 rounded-lg object-cover border border-[#F4D5D9]"
                            onError={(e) => {
                              e.target.src = "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80";
                            }}
                          />
                          <span className="font-medium text-[#1E1718] truncate max-w-[150px]">{item.title}</span>
                        </td>
                        <td className="py-3 pr-2 text-[#7C6F71]">{item.category || 'Beauty'}</td>
                        <td className="py-3 pr-2 font-semibold text-[#B24B5B]">${item.price.toFixed(2)}</td>
                        <td className="py-3 text-right">
                          <button
                            onClick={() => onDeleteProduct(item.id)}
                            className="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500 hover:text-rose-700 transition"
                            title="Delete product"
                          >
                            <i data-lucide="trash" class="w-4 h-4"></i>
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

            </div>

          </div>

        </div>
      );
    }

    // Render into root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
